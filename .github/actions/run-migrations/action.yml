name: Run Supabase Migrations
description: >-
  Applies pending Supabase migrations exactly once and logs the result.
  Production invocations must pass the environment-scoped Supabase service key
  from the protected `production` environment (required reviewers gate the
  secret); staging and preview invocations use their own scope and secrets.

inputs:
  supabase_url:
    description: Supabase project URL
    required: true
  supabase_service_key:
    description: >-
      Supabase service-role key. For environment=production this must be the
      environment-scoped secret from the protected `production` environment
      (only available after approval); staging/preview use their own scope.
    required: true
  environment:
    description: Target environment (staging | production)
    required: true
  git_sha:
    description: Git SHA being deployed
    required: true
  preview_scope:
    description: Optional scope for preview migrations (e.g. PR number or branch)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Guard production environment secret
      shell: bash
      env:
        TARGET_ENV: ${{ inputs.environment }}
        SUPABASE_SERVICE_KEY: ${{ inputs.supabase_service_key }}
      run: |
        if [ "$TARGET_ENV" = "production" ] && [ -z "$SUPABASE_SERVICE_KEY" ]; then
          echo "::error title=Missing production secret::environment=production requires the environment-scoped Supabase service key from the protected 'production' environment (approval gate). Refusing to run migrations."
          exit 1
        fi

    - name: Install Supabase CLI
      shell: bash
      run: |
        curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz \
          | tar -xz -C /usr/local/bin supabase

    - name: Link project
      shell: bash
      env:
        SUPABASE_ACCESS_TOKEN: ${{ inputs.supabase_service_key }}
      run: |
        supabase link --project-ref "$(echo '${{ inputs.supabase_url }}' | sed 's|https://||;s|\.supabase\.co.*||')"

    - name: Run migrations
      id: migrate
      shell: bash
      env:
        SUPABASE_ACCESS_TOKEN: ${{ inputs.supabase_service_key }}
        PREVIEW_SCOPE: ${{ inputs.preview_scope }}
      run: |
        echo "::group::Migration output"
        if [ -n "$PREVIEW_SCOPE" ]; then
          supabase db push --include-all --scope "$PREVIEW_SCOPE" 2>&1 | tee /tmp/migration.log
        else
          supabase db push --include-all 2>&1 | tee /tmp/migration.log
        fi
        echo "::endgroup::"

        STATUS="${PIPESTATUS[0]}"
        APPLIED=$(grep -c 'Applying migration' /tmp/migration.log || true)
        echo "migrations_applied=${APPLIED}" >> "$GITHUB_OUTPUT"
        exit "$STATUS"

    - name: Log migration metadata
      shell: bash
      run: |
        echo "::notice title=Migration [${{ inputs.environment }}]::Applied ${{ steps.migrate.outputs.migrations_applied }} migration(s) | sha=${{ inputs.git_sha }} | env=${{ inputs.environment }} | scope=${{ inputs.preview_scope }} | ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
