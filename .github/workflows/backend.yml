name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "app/backend/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "app/backend/**"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cache trust boundary (#565): dependency caches are only enabled for
      # trusted refs (pushes to main/develop). Pull requests — including those
      # from forks — never read or write the shared cache, so an untrusted run
      # cannot poison caches used by release or protected-branch builds.
      # Keys are scoped to OS + package manager + lockfile hash.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && 'pnpm' || '' }}
          cache-dependency-path: app/backend/pnpm-lock.yaml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Audit cache trust boundaries
        run: pnpm run ci:cache-trust:audit

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: OpenAPI spec must not diverge
        run: pnpm run docs:export:check
        env:
          NODE_ENV: test
          NETWORK: testnet
          SUPABASE_URL: https://spec-export.supabase.co
          SUPABASE_ANON_KEY: spec-export-key

      - name: API compatibility gate against previous release baseline
        if: github.event_name == 'pull_request'
        run: pnpm run api:compat:check
        env:
          NODE_ENV: test
          NETWORK: testnet
          SUPABASE_URL: https://spec-export.supabase.co
          SUPABASE_ANON_KEY: spec-export-key

      # Tests are run separately to avoid CI failures during development
      # Uncomment when tests are stable
      # - name: Run Unit Tests
      #   run: pnpm run test:unit
      #   env:
      #     NODE_ENV: test
      #     STELLAR_NETWORK: testnet
      #     SUPABASE_URL: https://test.supabase.co
      #     SUPABASE_ANON_KEY: test-key

      # Coverage thresholds are enforced by jest.unit.config.ts
      # (statements: 80, branches: 70, functions: 80, lines: 80).
      # This step fails the job when coverage drops below those thresholds.
      - name: Run Unit Tests with Coverage
        run: pnpm run test:unit:coverage
        env:
          NODE_ENV: test
          STELLAR_NETWORK: testnet
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-key

      - name: Upload unit test coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: app/backend/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Integration Tests with Coverage
        run: pnpm run test:int:coverage
        env:
          NODE_ENV: test
          STELLAR_NETWORK: testnet
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-key

      - name: Upload integration test coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-coverage
          path: app/backend/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Fuzz Tests
        run: pnpm run test:fuzz:ci
        env:
          NODE_ENV: test
          STELLAR_NETWORK: testnet
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-key

      - name: Database Migration Forward and Rollback Verification
        run: pnpm run db:verify-migrations

      - name: Financial Authorization Mutation Testing
        run: pnpm run test:mutation

      - name: Horizon-Backed Endpoints Performance Regression Tests
        run: pnpm run test:perf:horizon

      - name: Deploy Freeze and Override Tests
        run: pnpm run test:unit -- deploy-freeze
        env:
          NODE_ENV: test
          STELLAR_NETWORK: testnet
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-key

      - name: Payment Lifecycle Documentation Check
        run: pnpm run docs:check:payment-lifecycle
        env:
          NODE_ENV: test
          NETWORK: testnet
          SUPABASE_URL: https://spec-export.supabase.co
          SUPABASE_ANON_KEY: spec-export-key

      - name: Event Indexer Runbook Check
        run: pnpm run docs:check:indexer-runbook
        env:
          NODE_ENV: test
          NETWORK: testnet
          SUPABASE_URL: https://spec-export.supabase.co
          SUPABASE_ANON_KEY: spec-export-key

      # Credential rotation rehearsal (#567): exercises the rotation path with
      # placeholder, non-secret values only. Output is redacted; no real
      # deployment credentials are read or logged.
      - name: Deployment credential rotation dry-run
        run: pnpm run ci:rotate-credentials:dry-run
        env:
          NODE_ENV: test
          ROTATION_DRY_RUN: "true"
          DEPLOY_CREDENTIAL_PLACEHOLDER: "dry-run-placeholder"

  blue-green-fault-injection:
    name: Blue-Green Traffic Switching Fault Injection
    runs-on: ubuntu-latest
    # Staging-only fault-injection suite covering traffic controller timeout,
    # malformed response, and retry after an uncertain switch result.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    environment: staging
    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run blue-green traffic switching fault-injection tests
        run: pnpm run test:int -- blue-green-traffic-switch.int.spec.ts
        env:
          NODE_ENV: test
          DEPLOY_ENV: staging
          STELLAR_NETWORK: testnet
          SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          TRAFFIC_CONTROLLER_URL: ${{ secrets.STAGING_TRAFFIC_CONTROLLER_URL }}
          TRAFFIC_CONTROLLER_TOKEN: ${{ secrets.STAGING_TRAFFIC_CONTROLLER_TOKEN }}

  payment-lifecycle-integration:
    name: Payment Lifecycle Integration Tests
    runs-on: ubuntu-latest
    # Slow end-to-end suite (~30s+) that hits a real Supabase test project and
    # Horizon testnet. Runs on every PR against main and blocks merge, but is
    # kept out of the lint/build job so it never gates linting.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cache trust boundary (#565): this job runs on pull_request only, so
      # dependency caching is deliberately disabled to keep untrusted runs
      # out of the shared cache.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run payment lifecycle integration tests
        run: pnpm run test:int -- payment-lifecycle.int.spec.ts
        env:
          NODE_ENV: test
          STELLAR_NETWORK: testnet
          SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          TEST_ACCOUNT_MNEMONIC: ${{ secrets.TEST_ACCOUNT_MNEMONIC }}
          HORIZON_URL: https://horizon-testnet.stellar.org
