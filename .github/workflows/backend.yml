name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "app/backend/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "app/backend/**"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Cache trust boundary (#565): dependency caches are only enabled for
      # trusted refs (pushes to main/develop). Pull requests — including those
      # from forks — never read or write the shared cache, so an untrusted run
      # cannot poison caches used by release or protected-branch builds.
      # Keys are scoped to OS + package manager + lockfile hash.
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && 'pnpm' || '' }}
          cache-dependency-path: app/backend/pnpm-lock.yaml

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Audit cache trust boundaries
        run: pnpm run ci:cache-trust:audit

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: OpenAPI spec must not diverge
        run: pnpm run docs:export:check
        env:
          NODE_ENV: test
          NETWORK: testnet
          SUPABASE_URL: https://spec-export.supabase.co
          SUPABASE_ANON_KEY: spec-export-key

      - name: API compatibility gate against previous release baseline
        if: github.event_name == 'pull_request'
        run: pnpm run api:compat:check
        env:
          NODE_ENV: test
          NETWORK: testnet
          SUPABASE_URL: https://spec-export.supabase.co
          SUPABASE_ANON_KEY: spec-export-key

      # Tests are run separately to avoid CI failures during development
      # Uncomment when tests are stable
      # - name: Run Unit Tests
      #   run: pnpm run test:unit
      #   env:
      #     NODE_ENV: test
      #     STELLAR_NETWORK: testnet
      #     SUPABASE_URL: https://test.supabase.co
      #     SUPABASE_ANON_KEY: test-key

      # Coverage thresholds are enforced by jest.unit.config.ts
      # (statements: 80, branches: 70, functions: 80, lines: 80).
      # This step fails the job when coverage drops below those thresholds.
      - name: Run Unit Tests with Coverage
        run: pnpm run test:unit:coverage
        env:
          NODE_ENV: test
          STELLAR_NETWORK: testnet
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-key

      - name: Upload unit test coverage report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: backend-unit-coverage
          path: app/backend/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Integration Tests with Coverage
        run: pnpm run test:int:coverage
        env:
          NODE_ENV: test
          STELLAR_NETWORK: testnet
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-key

      - name: Upload integration test coverage report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: backend-integration-coverage
          path: app/backend/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Fuzz Tests
        run: pnpm run test:fuzz:ci
        env:
          NODE_ENV: test
          STELLAR_NETWORK: testnet
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-key

      - name: Database Migration Forward and Rollback Verification
        run: pnpm run db:verify-migrations

      - name: Financial Authorization Mutation Testing
        run: pnpm run test:mutation

      - name: Horizon-Backed Endpoints Performance Regression Tests
        run: pnpm run test:perf:horizon

      # Credential rotation rehearsal (#567): exercises the rotation path with
      # placeholder, non-secret values only. Output is redacted; no real
      # deployment credentials are read or logged.
      - name: Deployment credential rotation dry-run
        run: pnpm run ci:rotate-credentials:dry-run
        env:
          NODE_ENV: test
          ROTATION_DRY_RUN: "true"
          DEPLOY_CREDENTIAL_PLACEHOLDER: "dry-run-placeholder"

  payment-lifecycle-integration:
    name: Payment Lifecycle Integration Tests
    runs-on: ubuntu-latest
    # Slow end-to-end suite (~30s+) that hits a real Supabase test project and
    # Horizon testnet. Runs on every PR against main and blocks merge, but is
    # kept out of the lint/build job so it never gates linting.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Cache trust boundary (#565): this job runs on pull_request only, so
      # dependency caching is deliberately disabled to keep untrusted runs
      # out of the shared cache.
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run payment lifecycle integration tests
        run: pnpm run test:int -- payment-lifecycle.int.spec.ts
        env:
          NODE_ENV: test
          STELLAR_NETWORK: testnet
          SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          TEST_ACCOUNT_MNEMONIC: ${{ secrets.TEST_ACCOUNT_MNEMONIC }}
          HORIZON_URL: https://horizon-testnet.stellar.org

  release:
    name: Build, SBOM, and Attest Release Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image-digest: ${{ steps.digest.outputs.digest }}
      image-ref: ${{ steps.digest.outputs.image-ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: app/backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Capture immutable image digest
        id: digest
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "::error::Build did not produce an image digest; refusing to continue."
            exit 1
          fi
          image_ref="ghcr.io/${{ github.repository }}/backend@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image-ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "Resolved image reference: ${image_ref}"

      - name: Generate SBOM bound to image digest
        uses: anchore/sbom-action@df80a9811c0e3d0d0d0d0d0d0d0d0d0d0d0d0d0d # v0.17.2
        with:
          image: ${{ steps.digest.outputs.image-ref }}
          format: spdx-json
          output-file: sbom-${{ github.sha }}.spdx.json
          artifact-name: sbom-${{ steps.digest.outputs.digest }}

      - name: Verify SBOM was generated
        run: |
          set -euo pipefail
          sbom="sbom-${{ github.sha }}.spdx.json"
          if [ ! -s "$sbom" ]; then
            echo "::error::SBOM ${sbom} is missing or empty; failing release."
            exit 1
          fi

      - name: Sign and attest SBOM
        uses: actions/attest-sbom@115c3be05ff3974f61f515a5a1b1e8b5b1e5e5c5 # v2.0.0
        with:
          subject-path: sbom-${{ github.sha }}.spdx.json
          sbom-path: sbom-${{ github.sha }}.spdx.json

      - name: Attest build provenance for image digest
        uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c # v1.4.3
        with:
          subject-name: ghcr.io/${{ github.repository }}/backend
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Upload SBOM release artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: sbom-${{ steps.digest.outputs.digest }}
          path: sbom-${{ github.sha }}.spdx.json
          if-no-files-found: error
          retention-days: 90

  verify-attestation:
    name: Verify Attestation Before Promotion
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - name: Verify image digest is present
        run: |
          set -euo pipefail
          if [ -z "${{ needs.release.outputs.image-digest }}" ]; then
            echo "::error::Release job produced no image digest; blocking promotion."
            exit 1
          fi

      - name: Verify build provenance attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh attestation verify \
            "oci://${{ needs.release.outputs.image-ref }}" \
            --repo "${{ github.repository }}"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: verify-attestation
    environment: staging
    steps:
      - name: Deploy staging
        env:
          IMAGE_REF: ${{ needs.release.outputs.image-ref }}
          STAGING_DEPLOY_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_REF}" ]; then
            echo "::error::No verified image reference available for staging."
            exit 1
          fi
          echo "Deploying ${IMAGE_REF} to staging"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: verify-attestation
    # Protected environment: required reviewers and environment-scoped secrets
    # are configured in repository settings. Secrets are unavailable until the
    # approval gate is satisfied.
    environment: production
    steps:
      - name: Deploy production
        env:
          IMAGE_REF: ${{ needs.release.outputs.image-ref }}
          PRODUCTION_DEPLOY_TOKEN: ${{ secrets.PRODUCTION_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_REF}" ]; then
            echo "::error::No verified image reference available for production."
            exit 1
          fi
          echo "Deploying ${IMAGE_REF} to production"
