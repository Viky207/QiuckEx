name: Release Candidate Validation

# One command, one definition of the gate. This workflow calls
# scripts/rc-validate.sh — the same script a contributor runs locally — so
# "green locally" and "green in CI" cannot mean different things.
#
# This is the standalone, manual/nightly entry point to the gate. The CD
# pipeline also runs an `rc-validate` job that invokes the exact same
# `pnpm rc:validate` command and honours the same exit-code contract; the two
# are kept in sync deliberately. To avoid duplicate or conflicting runs, this
# workflow does NOT trigger on pull_request — per-PR early warning is owned by
# the CD pipeline's `rc-validate` job.
#
# Triggers:
#   workflow_dispatch — the manual release-candidate gate, including the slow
#                      stages that per-PR CI does not run.
#   schedule          — nightly regression run against main, so a candidate is
#                      never validated only at the moment someone remembers to.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Stages to run (comma-separated, blank = all)"
        type: string
        default: ""
      allow_skip:
        description: "Accept the run when an optional stage is skipped"
        type: boolean
        default: false
      ref:
        description: "Ref to validate"
        type: string
        default: "main"
  schedule:
    # 04:23 UTC daily.
    - cron: "23 4 * * *"

# No workflow-wide token scopes: both jobs only read the repository.
permissions: {}

concurrency:
  # Shared with the CD pipeline's `rc-validate` job so the two entry points
  # cannot run the gate against the same ref at the same time.
  group: rc-validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The capability-map stage diffs against the base ref.
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/contract

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install detect-secrets

      # Placeholder credentials for the OpenAPI export. The export boots the
      # Nest app, which validates its environment with Joi, but never reaches
      # Supabase. These are not secrets and must never be replaced with real
      # credentials in this workflow file.
      - name: Run release candidate gate
        env:
          # A candidate is validated against testnet only. The script refuses
          # mainnet outright — see docs/adr/0002.
          STELLAR_NETWORK: testnet
          RC_BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${{ inputs.stage }}" ]; then
            ARGS+=(--stage "${{ inputs.stage }}")
          fi
          if [ "${{ inputs.allow_skip }}" = "true" ]; then
            ARGS+=(--allow-skip)
          fi
          # Same command and exit-code contract as the CD pipeline's
          # `rc-validate` job: non-zero exit fails the gate.
          pnpm rc:validate "${ARGS[@]}"

      # Deterministic WASM build metadata check (issue #626).
      #
      # Toolchain drift can produce different contract binaries without an
      # obvious source change. This step records the toolchain and build
      # configuration metadata, attaches it to the built WASM artifact, and
      # compares the normalized output hash against the committed reference.
      # A mismatch fails release validation. The generated metadata file is
      # written under /tmp (never into the repo) so it cannot be silently
      # committed; the guard below also fails if a stray metadata file appears
      # in the working tree.
      - name: Verify deterministic WASM build metadata
        env:
          RC_WASM_METADATA_OUT: /tmp/rc-wasm-build-metadata.json
          RC_WASM_REFERENCE: app/contract/wasm-build-metadata.json
        run: |
          set -euo pipefail

          # Guard: generated metadata must never be committed by accident.
          if git ls-files --error-unmatch "$RC_WASM_METADATA_OUT" >/dev/null 2>&1; then
            echo "::error::Generated WASM build metadata ($RC_WASM_METADATA_OUT) is tracked in git; it must not be committed."
            exit 1
          fi

          # Record toolchain + build configuration metadata.
          RUSTC_VERSION="$(rustc --version)"
          CARGO_VERSION="$(cargo --version)"
          TARGET="wasm32-unknown-unknown"
          PROFILE="release"

          # Build the contract deterministically.
          ( cd app/contract && cargo build --target "$TARGET" --profile "$PROFILE" --locked )

          WASM_PATH="$(find app/contract/target/$TARGET/$PROFILE -maxdepth 1 -name '*.wasm' -print -quit)"
          if [ -z "$WASM_PATH" ] || [ ! -f "$WASM_PATH" ]; then
            echo "::error::No WASM artifact produced under app/contract/target/$TARGET/$PROFILE"
            exit 1
          fi

          # Normalized output hash: hash the WASM bytes only, so the metadata
          # file itself (which contains the hash) is not part of the input.
          WASM_SHA256="$(sha256sum "$WASM_PATH" | awk '{print $1}')"

          # Attach metadata to the artifact (written outside the repo).
          cat > "$RC_WASM_METADATA_OUT" <<EOF
          {
            "rustc": "$RUSTC_VERSION",
            "cargo": "$CARGO_VERSION",
            "target": "$TARGET",
            "profile": "$PROFILE",
            "wasm_sha256": "$WASM_SHA256"
          }
          EOF

          echo "WASM build metadata written to $RC_WASM_METADATA_OUT"
          cat "$RC_WASM_METADATA_OUT"

          # Compare against the committed reference hash. A mismatch means the
          # toolchain or build configuration drifted and must fail the gate.
          if [ ! -f "$RC_WASM_REFERENCE" ]; then
            echo "::error::Missing WASM build metadata reference: $RC_WASM_REFERENCE"
            exit 1
          fi

          EXPECTED_SHA256="$(grep -o '"wasm_sha256"[[:space:]]*:[[:space:]]*"[0-9a-f]*"' "$RC_WASM_REFERENCE" | grep -o '[0-9a-f]\{64\}' | head -n1)"
          if [ -z "$EXPECTED_SHA256" ]; then
            echo "::error::Could not read wasm_sha256 from $RC_WASM_REFERENCE"
            exit 1
          fi

          if [ "$WASM_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::WASM hash mismatch: expected $EXPECTED_SHA256, got $WASM_SHA256"
            echo "Toolchain or build configuration drifted; release validation failed."
            exit 1
          fi

          echo "WASM hash matches reference: $WASM_SHA256"

      # The compatibility gate is a hard promotion blocker: a candidate with
      # breaking API changes must never be promoted. It runs after the main
      # gate so a failing compatibility check is reported separately from the
      # rest of the validation, and it is never skipped — not on pull_request
      # (where the main gate runs --quick) and not via allow_skip.
      - name: Check API compatibility
        env:
          RC_BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          ./scripts/check-api-compatibility.sh

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-validation-${{ github.run_id }}
          path: |
            /tmp/rc-*.log
          retention-days: 90
          if-no-files-found: ignore

      - name: Summarize failure
        if: failure()
        run: |
          echo "### :x: Release candidate validation failed" >> "$GITHUB_STEP_SUMMARY"
          echo "See the gate report artifact and https://github.com/${{ github.repository }}/blob/main/docs/DEPLOYMENT-RUNBOOK.md" >> "$GITHUB_STEP_SUMMARY"

  load-test:
    name: Payment-link load test (k6)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    # RC validation only — never on pull requests. Fails the RC when the k6
    # thresholds (p95 < 500 ms, error rate < 1%) are breached.
    env:
      BASE_URL: ${{ secrets.STAGING_API_URL }}
      API_KEY: ${{ secrets.STAGING_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run payment-link creation load test
        if: env.BASE_URL != ''
        timeout-minutes: 10
        run: k6 run --summary-export=k6-summary.json app/backend/test/load/payment-link-creation.js

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary-${{ github.run_id }}
          path: k6-summary.json
          if-no-files-found: ignore

      - name: Summarize failure
        if: failure()
        run: |
          echo "### :x: Payment-link load test failed" >> "$GITHUB_STEP_SUMMARY"
          echo "A k6 threshold (p95 < 500ms, error rate < 1%) was breached, or the job timed out." >> "$GITHUB_STEP_SUMMARY"
