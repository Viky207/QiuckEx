name: Deployment Smoke Tests

on:
  deployment:
    status: success
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development

# No workflow-wide token scopes: the smoke test job only reads the repository.
permissions: {}

jobs:
  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine environment URL
        id: env-url
        run: |
          if [ "${{ github.event_name }}" == "deployment" ]; then
            echo "url=${{ github.event.deployment.environment_url }}" >> $GITHUB_OUTPUT
            echo "env=${{ github.event.deployment.environment }}" >> $GITHUB_OUTPUT
          else
            if [ "${{ inputs.environment }}" == "production" ]; then
              echo "url=https://api.quickex.io" >> $GITHUB_OUTPUT
              echo "env=production" >> $GITHUB_OUTPUT
            elif [ "${{ inputs.environment }}" == "staging" ]; then
              echo "url=https://api-staging.quickex.io" >> $GITHUB_OUTPUT
              echo "env=staging" >> $GITHUB_OUTPUT
            else
              echo "url=http://localhost:3000" >> $GITHUB_OUTPUT
              echo "env=development" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Wait for deployment to be ready
        run: |
          echo "Waiting for ${{ steps.env-url.outputs.env }} environment at ${{ steps.env-url.outputs.url }}"
          timeout=300
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if curl -sf "${{ steps.env-url.outputs.url }}/health" > /dev/null 2>&1; then
              echo "Deployment is ready!"
              exit 0
            fi
            echo "Waiting for deployment... (${elapsed}s/${timeout}s)"
            sleep 10
            elapsed=$((elapsed + 10))
          done
          echo "Deployment did not become ready within ${timeout}s"
          exit 1

      - name: Run smoke tests
        id: smoke-tests
        env:
          SMOKE_TEST_BASE_URL: ${{ steps.env-url.outputs.url }}
          SMOKE_TEST_USERNAME: ${{ secrets.SMOKE_TEST_USERNAME }}
          SMOKE_TEST_WEBHOOK_URL: ${{ secrets.SMOKE_TEST_WEBHOOK_URL }}
          NODE_ENV: test
          STELLAR_NETWORK: ${{ steps.env-url.outputs.env == 'production' && 'mainnet' || 'testnet' }}
        run: |
          echo "Running smoke tests against ${{ steps.env-url.outputs.url }}"
          echo "Environment: ${{ steps.env-url.outputs.env }}"

          pnpm run test:smoke:remote

      - name: Generate smoke test report
        if: always()
        id: test-report
        run: |
          echo "# Smoke Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env-url.outputs.env }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.env-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.smoke-tests.outcome }}" == "success" ]; then
            echo "## ✅ All smoke tests passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The deployment is healthy and all critical endpoints are functioning correctly." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Smoke tests failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "One or more smoke tests failed. Please review the logs above for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Critical Checks:" >> $GITHUB_STEP_SUMMARY
            echo "- Health endpoint: \`/health\`" >> $GITHUB_STEP_SUMMARY
            echo "- Readiness endpoint: \`/ready\`" >> $GITHUB_STEP_SUMMARY
            echo "- Link metadata: \`/links/metadata\`" >> $GITHUB_STEP_SUMMARY
            echo "- Username search: \`/username/search\`" >> $GITHUB_STEP_SUMMARY
            echo "- Soroban RPC connectivity" >> $GITHUB_STEP_SUMMARY
            echo "- Horizon connectivity" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on failure
        if: failure()
        env:
          SMOKE_TEST_WEBHOOK_URL: ${{ secrets.SMOKE_TEST_WEBHOOK_URL }}
        run: |
          echo "Smoke tests failed! Deployment may have issues."
          if [ -n "$SMOKE_TEST_WEBHOOK_URL" ]; then
            curl -sf -X POST "$SMOKE_TEST_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"❌ Smoke tests failed for ${{ steps.env-url.outputs.env }} (${{ steps.env-url.outputs.url }}). See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              || echo "Failed to post failure notification to webhook."
          else
            echo "SMOKE_TEST_WEBHOOK_URL not set; skipping webhook notification."
          fi
          exit 1
