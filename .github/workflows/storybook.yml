name: Storybook

on:
  push:
    branches: [main]
    paths:
      - "app/frontend/**"
      - "packages/design-tokens/**"
      - ".github/workflows/storybook.yml"
  pull_request:
    paths:
      - "app/frontend/**"
      - "packages/design-tokens/**"
  workflow_dispatch:

# No workflow-wide token scopes: only the Pages deploy job needs write access.
permissions: {}

concurrency:
  group: storybook-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build-storybook
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: app/frontend/storybook-static

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
