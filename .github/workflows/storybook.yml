name: Storybook

on:
  push:
    branches: [main]
    paths:
      - "app/frontend/**"
      - "packages/design-tokens/**"
      - ".github/workflows/storybook.yml"
  pull_request:
    paths:
      - "app/frontend/**"
      - "packages/design-tokens/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: storybook-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            app/frontend/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build-storybook
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: app/frontend/storybook-static
      - name: Summarize failure
        if: failure()
        run: |
          echo "### :x: Storybook build failed" >> "$GITHUB_STEP_SUMMARY"
          echo "See the failed step above for details." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
