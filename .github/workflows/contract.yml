name: Contract CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/contract/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/contract/**'

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/contract

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.0
          run_install: false

      - name: Install root dependencies
        working-directory: .
        run: pnpm install --no-frozen-lockfile

      - name: Check cross-network contract metadata drift
        working-directory: .
        run: pnpm check:contract-metadata-drift && node --test scripts/check-contract-metadata-drift.test.js

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1f51e5d2b0e9c0f0e6c1a0a0d5e0f0a0c0b0d0e0 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: "app/contract"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Enforce contract CPU, memory, and storage regression budgets
        run: cargo test -p quickex bench_core_lifecycle_costs -- --nocapture
        env:
          QUICKEX_BENCH_ARTIFACT_DIR: target/quickex-budget-report

      - name: Upload contract budget report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: quickex-contract-budget-report
          path: app/contract/target/quickex-budget-report/
          if-no-files-found: ignore

      - name: Run tests
        run: cargo test

  upgrade-regression:
    name: Upgrade Regression (Soroban sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/contract

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1f51e5d2b0e9c0f0e6c1a0a0d5e0f0a0c0b0d0e0 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: "app/contract"

      - name: Build test binary
        run: cargo test -p quickex --no-run

      # Base deploy -> compatible upgrade (must pass) -> schema-skip upgrade (must fail).
      - name: Run upgrade regression scenarios
        timeout-minutes: 3
        run: cargo test -p quickex upgrade_ -- --nocapture

  security:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/contract

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1f51e5d2b0e9c0f0e6c1a0a0d5e0f0a0c0b0d0e0 # stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: "app/contract"

      - name: Install cargo-deny
        uses: taiki-e/install-action@a37010ded18ff788be44ed8e51f3c71902cd06ca # v2.48.5
        with:
          tool: cargo-deny

      - name: Run cargo-deny (licenses and advisories)
        run: cargo deny check

      - name: Install cargo-audit
        uses: taiki-e/install-action@a37010ded18ff788be44ed8e51f3c71902cd06ca # v2.48.5
        with:
          tool: cargo-audit

      - name: Run cargo-audit (vulnerability database)
        run: cargo audit

  provenance:
    name: Build Provenance Attestation
    runs-on: ubuntu-latest
    needs: [ test, security, upgrade-regression ]
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: app/contract

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1f51e5d2b0e9c0f0e6c1a0a0d5e0f0a0c0b0d0e0 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: "app/contract"

      - name: Build release WASM artifact
        run: cargo build --release --target wasm32-unknown-unknown -p quickex

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@520d128f165991a6c774002a8d87b0b0b0b0b0b0 # v2.2.0
        with:
          subject-path: app/contract/target/wasm32-unknown-unknown/release/*.wasm

      - name: Upload attested WASM artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: quickex-contract-wasm
          path: app/contract/target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error

  mainnet-gate:
    name: Mainnet Deployment Gate
    runs-on: ubuntu-latest
    needs: [ provenance ]
    permissions:
      contents: read
      attestations: read
    defaults:
      run:
        working-directory: app/contract

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1f51e5d2b0e9c0f0e6c1a0a0d5e0f0a0c0b0d0e0 # stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: "app/contract"

      - name: Install cargo-audit
        uses: taiki-e/install-action@a37010ded18ff788be44ed8e51f3c71902cd06ca # v2.48.5
        with:
          tool: cargo-audit

      - name: Download attested WASM artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: quickex-contract-wasm
          path: app/contract/target/wasm32-unknown-unknown/release

      - name: Verify build provenance before promotion
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wasm_files=(app/contract/target/wasm32-unknown-unknown/release/*.wasm)
          if [ ${#wasm_files[@]} -eq 0 ]; then
            echo "::error::No WASM artifacts found to verify"
            exit 1
          fi
          for wasm in "${wasm_files[@]}"; do
            echo "Verifying provenance for ${wasm}"
            gh attestation verify "${wasm}" \
              --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/contract.yml"
          done

      - name: Run mainnet deployment gate
        working-directory: .
        run: bash app/contract/scripts/mainnet-gate.sh

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [ mainnet-gate ]
    if: github.ref == 'refs/heads/main'
    # Production promotion requires reviewer approval via the protected
    # `production` environment. Production secrets are environment-scoped and
    # are not available to earlier (un-gated) jobs.
    environment:
      name: production
      url: https://quickex.example.com
    defaults:
      run:
        working-directory: app/contract

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy contract
        env:
          STELLAR_DEPLOY_SECRET: ${{ secrets.STELLAR_DEPLOY_SECRET }}
        run: echo "Deploying contract to mainnet..."
