name: Contract CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/contract/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/contract/**'

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/contract

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Install root dependencies
        working-directory: .
        run: pnpm install --no-frozen-lockfile

      - name: Check cross-network contract metadata drift
        working-directory: .
        run: pnpm check:contract-metadata-drift && node --test scripts/check-contract-metadata-drift.test.js

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/contract"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Enforce contract CPU, memory, and storage regression budgets
        run: cargo test -p quickex bench_core_lifecycle_costs -- --nocapture
        env:
          QUICKEX_BENCH_ARTIFACT_DIR: target/quickex-budget-report

      - name: Upload contract budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickex-contract-budget-report
          path: app/contract/target/quickex-budget-report/
          if-no-files-found: ignore

      - name: Run tests
        run: cargo test

  security:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/contract

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/contract"

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo-deny (licenses and advisories)
        run: cargo deny check

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo-audit (vulnerability database)
        run: cargo audit

  mainnet-gate:
    name: Mainnet Deployment Gate
    runs-on: ubuntu-latest
    needs: [ test, security ]
    defaults:
      run:
        working-directory: app/contract

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/contract"

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run mainnet deployment gate
        working-directory: .
        run: bash app/contract/scripts/mainnet-gate.sh

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [ mainnet-gate ]
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: app/contract

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy contract
        run: echo "Deploying contract to mainnet..."
