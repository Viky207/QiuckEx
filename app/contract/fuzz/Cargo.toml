[package]
name = "escrow-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.escrow]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "fuzz_escrow_create"
path = "fuzz_targets/fuzz_escrow_create.rs"
test = false
doc = false

[[bin]]
name = "fuzz_proof_verify"
path = "fuzz_targets/fuzz_proof_verify.rs"
test = false
doc = false
